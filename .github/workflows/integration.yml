name: Manual Action integration
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke: two Sandbox flows; full: all scenarios; providers: real Slack/Teams deliveries'
        type: choice
        required: true
        default: smoke
        options: [smoke, full, providers]
      confirmation:
        description: Type RUN-COMMERCEKIT-SANDBOX-TESTS to create disposable Sandbox runs
        type: string
        required: true
      provider-confirmation:
        description: Providers only; type SEND-COMMERCEKIT-TEST-NOTIFICATION to authorize test sends
        type: string
        required: false
permissions:
  contents: read
  packages: read
concurrency:
  group: commercekit-action-integration
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'commercekit-tools/action-integration-tests' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Confirm deliberate live tests
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PROVIDER_CONFIRMATION: ${{ inputs.provider-confirmation }}
          SUITE: ${{ inputs.suite }}
        run: |
          test "$CONFIRMATION" = 'RUN-COMMERCEKIT-SANDBOX-TESTS'
          if [ "$SUITE" = 'providers' ]; then
            test "$PROVIDER_CONFIRMATION" = 'SEND-COMMERCEKIT-TEST-NOTIFICATION'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@commercekit-tools'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: node scripts/plan.mjs
        env:
          SUITE: ${{ inputs.suite }}
  scenario:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_scenario.yml
    with:
      scenario: ${{ matrix.scenario }}
      provider: ${{ matrix.provider }}
      confirmation: ${{ inputs.confirmation }}
      provider-confirmation: ${{ inputs.provider-confirmation }}
    secrets: inherit
