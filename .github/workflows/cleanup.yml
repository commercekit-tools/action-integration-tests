name: Manual cleanup dry-run integration
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-COMMERCEKIT-SANDBOX-TESTS to create a disposable cleanup fixture
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: commercekit-sandbox-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.repository == 'commercekit-tools/action-integration-tests' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RUN-COMMERCEKIT-SANDBOX-TESTS'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sandbox-e2e
    env:
      SCENARIO: cleanup-dry-run
      PROVIDER: none
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set private state directory for this job
        run: printf 'STATE_DIRECTORY=%s/commercekit-cleanup-integration\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@commercekit-tools'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and seed one isolated cleanup fixture
        id: prepare
        run: node scripts/runner.mjs prepare
      - name: Validate initial cleanup dry-run
        if: steps.prepare.outcome == 'success'
        uses: ./.github/actions/cleanup
        with:
          attempt: first
      - name: Validate repeated cleanup dry-run
        if: steps.prepare.outcome == 'success'
        uses: ./.github/actions/cleanup
        with:
          attempt: repeat
      - name: Assert unchanged inventory and zero target API mutations
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: node scripts/runner.mjs assert-cleanup
      - name: Delete disposable run and verify cleanup
        if: ${{ always() }}
        run: node scripts/runner.mjs cleanup
        env:
          STATE_DIRECTORY: ${{ runner.temp }}/commercekit-cleanup-integration
